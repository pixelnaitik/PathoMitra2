name: Android

# The APK/AAB was only ever produced by hand on one Windows machine, so there
# was no reproducible signed artifact to submit to Play and nothing caught a
# native project that stopped compiling. This job builds the web bundle, syncs it
# into the Android project and assembles both the Play artifact (.aab) and a
# installable .apk.
#
# Runs on the same tag push that cuts a release, and can be started by hand.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# One build per ref; a newer tag supersedes an in-flight build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        # Capacitor 8 compiles against Java 21 (see android/app/capacitor.build.gradle),
        # and the Gradle 9.1 wrapper needs at least 17.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Build web bundle and sync into the Android project
        # `build:android` = vite build with VITE_TARGET=native (drops the
        # web-deploy-only assets) followed by `cap sync android`, which is what
        # registers the plugins and copies dist/ into the APK's assets.
        run: npm run build:android

      - name: Decode the release keystore when one is configured
        # Empty secret leaves the file absent, and android/app/build.gradle then
        # emits an *unsigned* artifact with a loud warning instead of failing the
        # build — a fork without signing secrets still gets a compilable result.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret set — this run will produce an UNSIGNED artifact." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release_keystore.jks"
            echo "Keystore restored ($(wc -c < "$RUNNER_TEMP/release_keystore.jks") bytes)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble release AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release_keystore.jks
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        # Gradle only needs ANDROID_HOME, which the runner image already provides;
        # android/local.properties is deliberately not created (it is machine
        # specific and git-ignored).
        run: cd android && ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload the Play artifact (.aab)
        uses: actions/upload-artifact@v7
        with:
          name: pathomitra-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload the installable APK
        uses: actions/upload-artifact@v7
        with:
          name: pathomitra-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
