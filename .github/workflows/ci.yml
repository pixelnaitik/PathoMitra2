name: CI

on:
  pull_request:
    branches:
      - main

# Cancel a superseded run instead of paying for two builds of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Lint Code
        # lint:ci runs `tsc --noEmit` plus `eslint --max-warnings`, where the cap
        # is a ratchet maintained in package.json: CI fails if the warning count
        # grows, so debt cannot accumulate silently. Lower the cap in
        # package.json as part of the change that fixes warnings.
        run: npm run lint:ci
      - name: Run Tests With Coverage Gate
        run: npm run test:coverage
      - name: Build Project
        # The web bundle. Android is built by android.yml, which also proves the
        # native project still compiles and the plugins still sync — neither of
        # which any of the steps above can see.
        run: npm run build
