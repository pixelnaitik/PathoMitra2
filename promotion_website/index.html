<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />

    <!-- No remote font request and no service worker. Typography is the platform
         stack (leads with a locally installed 'Inter'), so the first paint never
         waits on a network round trip. This is a static, offline-safe brochure. -->

    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./android-chrome-512x512.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>PathoMitra — Lab Management Simplified</title>
    <meta
      name="description"
      content="PathoMitra — Lab Management Simplified. Offline, on-device digital pathology laboratory management for patient records, encrypted reports and lab analytics."
    />
    <meta
      name="keywords"
      content="pathology lab software, lab management system, digital pathology, patient reports, clinical lab console, lab management simplified"
    />
    <meta property="og:title" content="PathoMitra — Lab Management Simplified" />
    <meta
      property="og:description"
      content="Precision pathology, beautifully simple. The whole bench-to-report workflow — intake, results, digital sign-off and sealed PDF delivery — in one fast, offline-ready console."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PathoMitra — Lab Management Simplified" />
    <meta
      name="twitter:description"
      content="Offline digital pathology laboratory management console. Runs offline · No setup · Encrypted on-device records."
    />

    <script>
      // Colour mode follows the visitor's OS preference. This is a browser-local
      // setting (no storage of clinical data, no network) — the CSS blocks keyed on
      // [data-theme="dark"] apply before first paint, so there is no flash.
      (function () {
        try {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var r = document.documentElement;
          r.setAttribute('data-theme', dark ? 'dark' : 'light');
          r.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
